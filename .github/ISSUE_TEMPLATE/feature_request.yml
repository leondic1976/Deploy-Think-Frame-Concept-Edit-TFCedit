name: 기능 제안
description: ThinkFrame의 범위 안에서 기능을 제안합니다.
title: '[Feature] '
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 해결할 문제
      description: 기능 이름보다 먼저 해결하려는 사용 문제를 작성해 주세요.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안
      description: 필요한 최소 동작과 예상 사용 흐름을 작성해 주세요.
    validations:
      required: true
  - type: textarea
    id: exclusions
    attributes:
      label: 제외 범위
      description: 이 제안에 포함하지 않아도 되는 기능을 작성해 주세요.
