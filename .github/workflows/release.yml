name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag and app version
        run: npm run version:check -- --tag "$GITHUB_REF_NAME"

      - name: Validate
        run: npm run check

  build:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            platform_id: windows
            arch: x64
            runner: windows-latest
            command: npm run make:windows
          - platform: macOS
            platform_id: macos
            arch: arm64
            runner: macos-15
            command: npm run make:mac:arm64
          - platform: macOS
            platform_id: macos
            arch: x64
            runner: macos-15-intel
            command: npm run make:mac:x64
          - platform: Linux
            platform_id: linux
            arch: x64
            runner: ubuntu-24.04
            command: npm run make:linux
    runs-on: ${{ matrix.runner }}
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: ${{ matrix.command }}

      - name: Collect release assets
        run: npm run artifacts -- ${{ matrix.platform_id }} ${{ matrix.arch }}

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: ThinkFrame-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: ThinkFrame-*
          path: release-assets
          merge-multiple: true

      - name: Create checksums
        working-directory: release-assets
        run: |
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 |
            sort -z |
            xargs -0 sha256sum |
            sed 's#  \./# *#' > SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --title "ThinkFrame $GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
