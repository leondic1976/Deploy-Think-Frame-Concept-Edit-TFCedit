name: CI

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check version
        run: npm run version:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  package:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            platform_id: windows
            arch: x64
            runner: windows-latest
            command: npm run make:windows
          - platform: macOS
            platform_id: macos
            arch: arm64
            runner: macos-15
            command: npm run make:mac:arm64
          - platform: macOS
            platform_id: macos
            arch: x64
            runner: macos-15-intel
            command: npm run make:mac:x64
          - platform: Linux
            platform_id: linux
            arch: x64
            runner: ubuntu-24.04
            command: npm run make:linux
    runs-on: ${{ matrix.runner }}
    name: Package ${{ matrix.platform }} ${{ matrix.arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: ${{ matrix.command }}

      - name: Collect release assets
        run: npm run artifacts -- ${{ matrix.platform_id }} ${{ matrix.arch }}

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: ThinkFrame-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
